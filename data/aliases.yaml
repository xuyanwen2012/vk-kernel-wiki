## Canonical Aliases
## Maps canonical terms to known aliases for search and normalization.
## Format: canonical_term: [alias1, alias2, ...]
##
## Canonical terms are either vocabulary terms from data/tags.yaml or nodes of
## the architecture tree in data/architectures.yaml.
## No alias may map to two canonical terms (compared case-insensitively).

